name: Aerio native mobile
on:
  push:
    branches: [main]
    paths: ['package.json', 'mobile/package.json']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version:
    uses: ./.github/workflows/version-gate.yml
    with:
      manifests: '["package.json", "mobile/package.json"]'
  checks:
    needs: version
    if: needs.version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx expo install --check
  ios-native:
    needs: version
    if: needs.version.outputs.should_build == 'true'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: xcodebuild -version
      - run: node scripts/ios-native-audit.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aerio-ios-native-evidence
          path: mobile/artifacts/
          if-no-files-found: warn
