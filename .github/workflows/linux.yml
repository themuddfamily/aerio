name: Linux build

on:
  push:
    branches: [main, 'codex/native-validation-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install native desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils openbox dbus-x11 gnome-keyring libglib2.0-bin python3 python3-gi libgtk-3-0t64 libnss3 libasound2t64
      - name: Permit Chromium sandbox user namespaces on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm test
      - run: npm run test:imap
      - run: npm run test:live-matrix
      - name: Test desktop with an isolated keyring, display and window manager
        run: npm run test:platform:linux:desktop
      - name: Package and verify Linux artifacts
        run: npm run package:linux
        env:
          AERIO_REQUIRE_BUILTIN_OAUTH: '0'
      - run: npm run test:platform:linux
      - run: npm run test:platform:linux:containers
      - uses: actions/upload-artifact@v7
        with:
          name: aerio-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error
