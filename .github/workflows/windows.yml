name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:live-matrix
      - run: npm run test:desktop
      - name: Package Windows artifacts
        run: npm run package:win
        env:
          AERIO_REQUIRE_BUILTIN_OAUTH: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ github.event_name == 'pull_request' && '' || secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v7
        with:
          name: aerio-windows
          path: |
            release/*-setup-*.exe
            release/*-portable-*.exe
          if-no-files-found: error
