name: Check package version

on:
  workflow_call:
    inputs:
      manifests:
        type: string
        default: '["package.json"]'
    outputs:
      should_build:
        value: ${{ jobs.version.outputs.should_build }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Compare versions across the complete push
        id: check
        env:
          VERSION_MANIFESTS: ${{ inputs.manifests }}
        run: node scripts/version-build-gate.mjs
