name: macOS build

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    uses: ./.github/workflows/version-gate.yml
  build:
    needs: version
    if: needs.version.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compile native Apple-event integration for this architecture
        run: npm run build:mac-native
      - run: npm test
      - run: npm run test:imap
      - run: npm run test:live-matrix
      - run: npm run test:desktop
      - name: Package and verify native macOS artifacts
        run: npm run package:mac
        env:
          AERIO_REQUIRE_BUILTIN_OAUTH: '0'
      - run: npm run test:platform:mac
      - run: npm run test:platform:mac:containers
      - uses: actions/upload-artifact@v7
        with:
          name: aerio-macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
